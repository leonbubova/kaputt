# shop.local — edge nginx. Edit here, then: docker exec wg-nginx nginx -s reload
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 80;
    listen 443 ssl;
    server_name shop.local www.shop.local;

    ssl_certificate     /etc/nginx/certs/shop.crt;
    ssl_certificate_key /etc/nginx/certs/shop.key;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options DENY;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /old {
        return 301 /new;
    }

    location = /new {
        default_type text/plain;
        return 200 "new page\n";
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        client_max_body_size 10m;
        proxy_pass http://wg-backend:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
