# wg-backend — fake shop API (not part of the exercise, do not edit)
server {
    listen 9000;
    default_type text/plain;
    location = /        { return 200 "backend ok\n"; }
    location = /orders  { return 200 "orders=[]\n"; }
    location = /whoami  { return 200 "host=$host\nxff=$http_x_forwarded_for\n"; }
    location = /upload  { return 200 "upload ok\n"; }
    location /          { return 404 "backend 404 $request_uri\n"; }
}
