name: wg
services:
  web:
    image: nginx:1.27-alpine
    container_name: wg-web
    networks: [front]
  app:
    image: busybox:1.36
    container_name: wg-app
    command: sh -c 'while true; do wget -qO- -T 2 http://web/ >/dev/null && echo "web ok" || echo "web unreachable"; sleep 3; done'
    networks: [back]
networks:
  front: {name: wg-front}
  back:  {name: wg-back}
