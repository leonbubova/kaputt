apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    app: {{ .Release.Name }}
data:
  index.html: |
    <h1>{{ .Release.Name }}</h1>
    <p>env={{ .Values.environment }} domain={{ required "domain is required (set .Values.domain, e.g. via a values file)" .Values.domain }}</p>
