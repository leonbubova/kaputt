apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: html
          configMap:
            name: {{ .Release.Name }}-html
      initContainers:
        - name: wait-for-cache
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ .Release.Name }}-cache 6379; do echo \"cache {{ .Release.Name }}-cache:6379 unreachable, retrying\"; sleep 2; done"]
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
