name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  levels:
    name: play ${{ matrix.track }} track
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [shell, git, bash]
    steps:
      - uses: actions/checkout@v4
      - name: run every level (break → must fail → fix → must pass)
        run: test/run-all.sh ${{ matrix.track }}
  kotlin:
    name: play kotlin track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: wg start (downloads kotlinc once) + every level
        run: WG_TRACK=kotlin bin/wg start && test/run-all.sh kotlin
  shellcheck:
    name: shellcheck CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q shellcheck >/dev/null && shellcheck -S warning bin/wg lib/common.sh || true
